[package]
name = "origami-reader"
version = "0.1.0"
description = "A local reading and speech workspace"
authors = ["Origami contributors"]
license = "MPL-2.0"
edition = "2021"
rust-version = "1.85"

[lib]
name = "origami_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
rfd = "0.15"
base64 = "0.22"

[dev-dependencies]
tempfile = "3"
