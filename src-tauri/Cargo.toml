[package]
name = "origami-reader"
version = "0.1.0"
description = "A local reading and speech workspace"
authors = ["Sov3ryn"]
license-file = "../LICENSE"
edition = "2021"
rust-version = "1.85"

[lib]
name = "origami_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
rfd = "0.15"
base64 = "0.22"
argon2 = "0.5"
chacha20poly1305 = "0.10"
getrandom = "0.2"
# Work Mode: local embedding models (IBM Granite, Apache-2.0) run in-process.
# ONNX Runtime is loaded at run time from the runtime folder beside the app,
# so the app itself starts without it (or the Visual C++ runtime it needs).
ort = { version = "=2.0.0-rc.14", default-features = false, features = ["std", "ndarray", "load-dynamic", "api-24"] }
libloading = "0.8"
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"] }
ureq = "3"
sha2 = "0.10"
# Updates: Ed25519-signed component lists and zip packages (see docs/UPDATES.md).
ed25519-dalek = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
# Studio audiobook export (src/studio_audio.rs): FLAC and WAV takes, resampling,
# MPEG-4 and ID3 tags with chapters, and the square cover.
claxon = "0.4"
hound = "3.5"
rubato = "5.0.1"
mp4ameta = "0.13"
id3 = "1.17"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
# Studio print PDFs (src/studio_book.rs): Typst as a library, sandboxed.
typst = "0.15.1"
typst-pdf = "0.15.1"
typst-layout = "0.15.1"

[dev-dependencies]
tempfile = "3"

# Handwriting recognition with the recogniser built into Windows (src/ink.rs).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["UI_Input_Inking", "Foundation_Collections", "Foundation_Numerics", "Win32_Foundation", "Win32_Media_MediaFoundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_UI_Shell_PropertiesSystem"] }
windows-collections = "0.3"
windows-numerics = "0.3"
